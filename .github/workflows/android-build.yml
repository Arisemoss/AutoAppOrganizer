name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --build-cache

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --build-cache

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAppOrganizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAppOrganizer-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk