name: Feature Request
description: Suggest a new feature or enhancement
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe the feature you'd like.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this relate to?
      options:
        - Classification / Category Dictionary
        - Accessibility Service
        - UI / UX
        - Backup & Restore
        - Permissions
        - Other
    validations:
      required: true
